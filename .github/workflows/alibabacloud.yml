name: Build and Deploy to ACK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate repository layout
        run: |
          echo "Validating repository setup..."
          ls -la
          if [ -f Dockerfile ]; then
            echo "Dockerfile found"
          else
            echo "Warning: Dockerfile not found; deployment job will still be skipped until configured."
          fi

  deploy:
    needs: validate
    if: ${{ secrets.ACCESS_KEY_ID != '' && secrets.ACCESS_KEY_SECRET != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION_ID: cn-hangzhou
      REGISTRY: registry.cn-hangzhou.aliyuncs.com
      NAMESPACE: namespace
      IMAGE: repo
      TAG: ${{ github.sha }}
      ACK_CLUSTER_ID: clusterID
      ACK_DEPLOYMENT_NAME: nginx-deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          region-id: "${{ env.REGION_ID }}"
          access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"

      - name: Build and push image to ACR
        run: |
          docker build -t "$REGISTRY/$NAMESPACE/$IMAGE:$TAG" .
          docker push "$REGISTRY/$NAMESPACE/$IMAGE:$TAG"

      - name: Set ACK context
        uses: aliyun/ack-set-context@v1
        with:
          access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
          cluster-id: "${{ env.ACK_CLUSTER_ID }}"

      - name: Deploy image to ACK
        run: |
          kubectl set image deployment/${ACK_DEPLOYMENT_NAME} ${ACK_DEPLOYMENT_NAME}=$REGISTRY/$NAMESPACE/$IMAGE:$TAG
          kubectl rollout status deployment/${ACK_DEPLOYMENT_NAME} --timeout=180s
          kubectl get services -o wide
