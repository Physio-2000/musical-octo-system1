# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.name: Scheduled Income Report

on:
  schedule:
    - cron: '0 12 * * *'   # Run daily at 12:00 UTC, Python logic decides if it should execute
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check if should run (every 3 weeks from Oct 10, 2026)
        id: check
        run: |
          python3 << 'EOF'
          from datetime import datetime, timedelta
          
          # Start date: October 10, 2026 at 12:00 PM UTC
          start_date = datetime(2026, 10, 10, 12, 0, 0)
          
          # Current UTC time
          now = datetime.utcnow()
          
          # Calculate days since start
          days_elapsed = (now - start_date).days
          
          # Check if we're in a valid 3-week cycle
          # Valid windows: days 0-1, 21-22, 42-43, etc. (with 1-day tolerance)
          cycle_day = days_elapsed % 21
          
          should_run = cycle_day <= 1
          
          print(f"Start date: {start_date}")
          print(f"Current time: {now}")
          print(f"Days elapsed: {days_elapsed}")
          print(f"Current cycle day: {cycle_day}")
          print(f"Should run: {should_run}")
          
          with open("/tmp/schedule_check.txt", "w") as f:
            f.write(f"should_run={str(should_run).lower()}")
          EOF
          
          cat /tmp/schedule_check.txt >> $GITHUB_OUTPUT

  generate-income-report:
    needs: check-schedule
    if: needs.check-schedule.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate income report
        run: |
          python income_report.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: income-reports
          path: reports/
          retention-days: 90

      - name: Log report generation
        run: |
          python3 << 'EOF'
          from datetime import datetime
          print(f"✓ Income report generated successfully at {datetime.utcnow().isoformat()}Z")
          print("✓ Next scheduled run: in 3 weeks")
          EOF
